<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SID SYNTH</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="knob.css">
</head>
<body>
  <div class="container">
    <div class="header">SID SYNTH</div>
    
    <div class="screen">
      <canvas id="oscilloscope"></canvas>
      <canvas id="spectroscope" style="width:100%;height:120px;border:1px solid #1a2a1a;display:block;margin-top:2px;"></canvas>
      <div class="note-display" id="noteDisplay">_</div>
    </div>

    <div class="keyboard" id="keyboard"></div>

    <div class="workspace">
      <div class="tool-bar" id="tool-bar">
        <div class="tool-bar-title">COMPONENTS</div>
        <div class="tool-item" data-type="oscillator" data-id="osc1">OSC 1</div>
        <div class="tool-item" data-type="oscillator" data-id="osc2">OSC 2</div>
        <div class="tool-item" data-type="oscillator" data-id="osc3">OSC 3</div>
        <div class="tool-item" data-type="filter">FILTER</div>
        <div class="tool-item" data-type="adsr">ADSR</div>
        <div class="tool-item" data-type="effects">EFFECTS</div>
        <div class="tool-item" data-type="lfo">LFO</div>
        <div class="tool-item" data-type="mixer">MIXER</div>
        <div class="tool-item" data-type="splitter">SPLITTER</div>
        <div class="tool-item" data-type="sequencer">SEQ</div>
      </div>
      <div class="rack" id="rack">
        <svg class="connection-line" id="connectionsSvg"></svg>
      </div>
    </div>

    <div class="panel">
      <div class="row row-center">
        <button class="preset-btn" data-preset="bass">BASS</button>
        <button class="preset-btn" data-preset="lead">LEAD</button>
        <button class="preset-btn" data-preset="pad">PAD</button>
        <button class="preset-btn" data-preset="drum">DRUM</button>
      </div>
      <div class="row row-center" style="margin-top:6px">
        <button class="preset-btn" id="savePreset">SAVE</button>
        <button class="preset-btn" id="loadPreset">LOAD</button>
        <button class="preset-btn" id="deletePreset">DEL</button>
        <select id="presetList" style="width:100px"></select>
      </div>
      <div class="row row-center" style="margin-top:6px">
        <button class="preset-btn" id="savePatch">SAVE PATCH</button>
        <button class="preset-btn" id="loadPatch">LOAD PATCH</button>
        <input type="file" id="patchFile" accept=".json" style="display:none">
      </div>
    </div>

    <div class="row row-center" style="margin-top:10px">
      <button class="preset-btn" id="midiConnect">MIDI CONNECT</button>
      <span id="midiStatus" style="color:#3a5a3a;font-size:11px;letter-spacing:1px;"></span>
    </div>    
    <button class="preset-btn" style="width:100%;padding:14px;font-size:14px;letter-spacing:4px;margin-top:10px;" id="play">PLAY NOTE</button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
